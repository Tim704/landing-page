<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BucketFillers</title>
<!-- Correct UA theming for form controls, scrollbars, etc. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120D" media="(prefers-color-scheme: dark)">
<!-- Inline SVG favicon (Warm Almanac): ink-bordered gold tile with an ink-outlined
     warm-white bucket — a stamped field-journal object, self-contained, crisp at any size. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%220.85%22%20y%3D%220.85%22%20width%3D%2230.3%22%20height%3D%2230.3%22%20rx%3D%225.3%22%20fill%3D%22%23E9A23B%22%20stroke%3D%22%232B2420%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M10%2012.2C10.6%206.4%2021.4%206.4%2022%2012.2%22%20fill%3D%22none%22%20stroke%3D%22%232B2420%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M8.6%2012%2023.4%2012%2020.9%2023.2Q20.7%2024.4%2019.5%2024.4L12.5%2024.4Q11.3%2024.4%2011.1%2023.2Z%22%20fill%3D%22%23FFF7EA%22%20stroke%3D%22%232B2420%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%2212%22%20rx%3D%227.4%22%20ry%3D%222.1%22%20fill%3D%22%23E9A23B%22%2F%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%2212.7%22%20rx%3D%225.3%22%20ry%3D%221.4%22%20fill%3D%22%23FFF7EA%22%2F%3E%3C%2Fsvg%3E">

<!-- ============================================================
     No-flash theme bootstrap. Runs BEFORE the body renders so the
     correct theme is applied on the <html> element immediately and
     there is no flash of the wrong colors. Reads an explicit choice
     from localStorage; otherwise falls back to the system preference.
     ============================================================ -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("bf-theme");
      var theme = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     WARM ALMANAC — design tokens, themed per mode via html[data-theme].
     A cozy printed-paper aesthetic with neo-brutalist bones: cream paper,
     ink-black borders, HARD offset shadows (zero blur), Fraunces (display)
     + Hanken Grotesk (body). One gold accent does the editorial work; the
     jewel tones appear ONLY as service-state leds (forest=up, coral=down)
     and as a single quiet per-row identity numeral. Light/dark automatic.
     ============================================================ */
  html[data-theme="light"] {
    --bg:    #FBF6EC;  /* warm paper */
    --ink:   #2B2420;  /* near-black ink — every text AND every border */
    --card:  #FFFDF8;  /* secondary surface */
    --inset: #FBF6EC;  /* inset cells / pill base */
    --hero:  #FFF6E4;  /* the one featured (frontispiece) surface tint */

    --muted:  #6B5F54;  /* 3-step warm text hierarchy */
    --muted2: #8A7E72;
    --muted3: #A89C8E;

    --accent: #E9A23B;  /* gold — the one saturated fill (hero badge, dots) */
    --gold:   #B08442;  /* gold ink — kickers + action labels (ports) */

    --track:  #EADFCE;
    --goodbg: #DCF0EA;  /* mint tint behind an "online" pill */

    --hair:  rgba(43,36,32,.12);  /* divider lines only — never a box edge */
    --hair2: rgba(43,36,32,.25);

    --shadow: rgba(43,36,32,.9);  /* hard offset shadow ink */
    --focus:  rgba(233,162,59,.9);

    --grad1: rgba(233,162,59,.18);  /* gold glow, top-right */
    --grad2: rgba(42,157,143,.16);  /* teal glow, bottom-left */

    --up:   #2E9E5B;  /* forest — online led */
    --down: #E8654F;  /* coral — offline led */
    --id-1: #2A9D8F;  /* teal   — Notes row numeral */
    --id-2: #2D65A4;  /* blue   — World Cup row numeral */
    --id-3: #6C5CE7;  /* violet — Florence row numeral */
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg:    #15120D;
    --ink:   #F1E7D6;
    --card:  #221C15;
    --inset: #2B241B;
    --hero:  #2A2017;

    --muted:  #C7BAA6;
    --muted2: #9E9282;
    --muted3: #7E7363;

    --accent: #E9A23B;  /* gold fill stays constant across themes */
    --gold:   #D9B271;

    --track:  #3A3329;
    --goodbg: #1E3A33;

    --hair:  rgba(241,231,214,.14);
    --hair2: rgba(241,231,214,.26);

    --shadow: rgba(0,0,0,.55);
    --focus:  rgba(233,162,59,.85);

    --grad1: rgba(233,162,59,.10);
    --grad2: rgba(42,157,143,.10);

    --up:   #4CB571;  /* leds + identity numerals lifted for the dark ground */
    --down: #F0795F;
    --id-1: #4FBEAE;
    --id-2: #6498D9;
    --id-3: #9D8CFF;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* Never a flat fill: two soft radial glows ride over the paper. */
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, var(--grad1), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--grad2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Hanken Grotesk", sans-serif;
    font-weight: 400;
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Gentle theme transition on the things that change color; the press
     elements add fast transform/shadow transitions for the tactile click. */
  body, .topbar, .svc-list, footer {
    transition: background-color 0.28s ease, border-color 0.28s ease, color 0.28s ease;
  }
  .hero, .theme-toggle {
    transition:
      transform 0.12s ease, box-shadow 0.12s ease,
      background-color 0.28s ease, border-color 0.28s ease, color 0.28s ease;
  }
  .svc { transition: background-color 0.2s ease, color 0.2s ease; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(2rem, 5vw, 4.5rem) clamp(1.25rem, 5vw, 2rem) 4rem;
  }

  /* The signature little label — uppercase, tracked-out, gold. */
  .kicker {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  /* ---------------- top bar : a printed running-head on bare paper ----------------
     Flat on the paper; the one ink line allowed here is a bottom page-rule. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 0.9rem;
    border-bottom: 1.5px solid var(--ink);
    font-size: 0.74rem;
    color: var(--muted2);
  }
  .topbar .mark {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .topbar .mark .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);   /* a small gold folio mark */
    display: inline-block;
    flex-shrink: 0;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  #clock {
    font-weight: 500;
    font-size: 0.78rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    white-space: nowrap;
  }

  /* theme toggle — the one fully-pressable control in the bar */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.7rem;
    line-height: 1;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .theme-toggle:hover  { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--shadow); }
  .theme-toggle:active { transform: translate(2px, 2px);   box-shadow: 1px 1px 0 var(--shadow); }
  .theme-toggle svg { width: 15px; height: 15px; display: block; }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ---------------- masthead : the almanac title plate (bare paper) ---------------- */
  .masthead { margin-top: clamp(2.5rem, 7vw, 4.5rem); }
  .masthead .kicker { margin-bottom: 1rem; }
  /* The single stamped display gesture. */
  .wordmark {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-optical-sizing: auto;
    font-weight: 900;
    font-size: clamp(3rem, 12vw, 5.5rem);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .descriptor {
    margin-top: 1rem;
    font-size: 1rem;
    color: var(--muted);
    max-width: 46ch;
  }
  /* single quiet aggregate readout — the only inline serif-numeral editorial moment */
  .meta-line {
    margin-top: 1.6rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.55rem 0.8rem;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted2);
  }
  .meta-line .meta-kicker {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold);
  }
  .meta-line .sep { opacity: 0.5; }
  .meta-line #count { color: var(--muted); }
  .meta-line #count strong {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
  }
  /* a stamped status dot (ink ring sits OUTSIDE so the full color reads) */
  .agg-led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted3);
    box-shadow: 0 0 0 1.5px var(--ink);
    display: inline-block;
    flex-shrink: 0;
    margin: 0 0.15rem;
  }
  .meta-line[data-state="up"]      .agg-led { background: var(--up); }
  .meta-line[data-state="partial"] .agg-led { background: var(--accent); }
  .meta-line[data-state="down"]    .agg-led { background: var(--down); }
  .meta-line[data-state="na"]      .agg-led { background: var(--muted3); }

  /* ---------------- hero : BucketFillers, the one fully-pressed frontispiece ---------------- */
  .hero {
    display: block;
    text-decoration: none;
    color: inherit;
    margin-top: clamp(2.25rem, 6vw, 3.25rem);
    background: var(--hero);
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    padding: clamp(1.75rem, 5vw, 2.6rem);
    box-shadow: 6px 6px 0 var(--shadow);
    position: relative;
  }
  /* press into the shadow */
  .hero:hover  { transform: translate(-1px, -1px); box-shadow: 8px 8px 0 var(--shadow); }
  .hero:active { transform: translate(2px, 2px);   box-shadow: 2px 2px 0 var(--shadow); }
  /* focus ring is a separate outline so it survives the shadow collapse on press */
  .hero:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  /* THE one saturated gold fill on the page — a stamped tiny badge.
     Text is the constant dark ink (#2B2420) because the gold fill is the
     SAME in both themes; var(--ink) would flip to cream in dark and fail AA. */
  .eyebrow {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    color: #2B2420;
    background: var(--accent);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 0.32rem 0.6rem;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .hero-foot {
    margin-top: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .host {
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* the one mono detail: the port reads like a field-journal call-number */
  .host .port, .svc-host .port {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .open {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .open .arrow { transition: transform 0.13s ease; }
  .hero:hover .open .arrow,
  .hero:focus-visible .open .arrow { transform: translateX(4px); }

  /* ---------------- secondary services : a quiet ruled ledger ---------------- */
  .section-label {
    margin: clamp(2.75rem, 7vw, 3.75rem) 0 0.25rem;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .svc-list {
    margin-top: 0.5rem;
    border-top: 1.5px solid var(--hair2);   /* a divider rule, not a box */
    counter-reset: svc;
  }
  .svc {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 0.85rem 1.25rem;
    text-decoration: none;
    color: inherit;
    padding: 1.15rem 0.65rem;
    border-bottom: 1.5px solid var(--hair2);
    border-radius: 14px;
    counter-increment: svc;
  }
  .svc:hover, .svc:focus-visible { outline: none; background: var(--inset); }
  .svc:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .svc-main { min-width: 0; }
  .svc-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ink);
  }
  /* the almanac ledger numeral — generated from a CSS counter so the
     JS-built markup stays untouched; jewel color is per-service identity. */
  .svc-name::before {
    content: counter(svc, decimal-leading-zero);
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    color: var(--id-1);
    margin-right: 0.6em;
    opacity: 0.85;
  }
  .svc:nth-child(1) .svc-name::before { color: var(--id-1); }
  .svc:nth-child(2) .svc-name::before { color: var(--id-2); }
  .svc:nth-child(3) .svc-name::before { color: var(--id-3); }
  .svc:hover .svc-name::before { opacity: 1; }
  .svc-host {
    margin-top: 0.2rem;
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .svc-arrow {
    color: var(--muted2);
    font-size: 0.95rem;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .svc:hover .svc-arrow,
  .svc:focus-visible .svc-arrow { color: var(--ink); transform: translateX(3px); }

  /* ---------------- status pill (hero + list) : stamped season glyphs ----------------
     The pill carries all three signatures; the led carries the jewel STATE
     color while the LABEL text stays ink for max contrast on every fill. */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--inset);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 0.24rem 0.6rem;
    box-shadow: 2px 2px 0 var(--shadow);
    white-space: nowrap;
  }
  .status .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted2);
    box-shadow: 0 0 0 1.5px var(--ink);   /* stamped ring, sits outside the dot */
    flex-shrink: 0;
  }
  .status[data-state="pending"] .led { background: var(--muted2); animation: pulse 1.3s ease-in-out infinite; }
  .status[data-state="up"]      { background: var(--goodbg); }   /* earned mint tint */
  .status[data-state="up"]   .led { background: var(--up); }
  .status[data-state="down"] .led { background: var(--down); }
  /* "na" = the status backend is unreachable; stay neutral, don't guess */
  .status[data-state="na"]   .led { background: var(--muted3); opacity: 0.6; }

  /* ---------------- footer : the colophon (bare paper) ---------------- */
  footer {
    margin-top: clamp(3rem, 8vw, 4rem);
    padding-top: 1.5rem;
    border-top: 1.5px solid var(--hair2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    color: var(--muted2);
    font-weight: 400;
  }
  footer #year { font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ---------------- focus-visible (global) ---------------- */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------------- animation ---------------- */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  @media (max-width: 520px) {
    .svc {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "main arrow"
        "status arrow";
      row-gap: 0.5rem;
    }
    .svc-main    { grid-area: main; }
    .svc .status { grid-area: status; justify-self: start; }
    .svc-arrow   { grid-area: arrow; align-self: center; }
  }

  /* reduced motion: disable animation + the press transforms, pin pressed shadows */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .hero:hover, .hero:active, .hero:focus-visible,
    .theme-toggle:hover, .theme-toggle:active,
    .svc:hover { transform: none; }
    .hero:hover, .hero:active { box-shadow: 6px 6px 0 var(--shadow); }
    .theme-toggle:hover, .theme-toggle:active { box-shadow: 2px 2px 0 var(--shadow); }
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- top bar: short mark + live clock + theme toggle -->
    <header class="topbar">
      <span class="mark"><span class="dot" aria-hidden="true"></span>timhufnagel.org</span>
      <div class="topbar-right">
        <time id="clock" aria-label="Current date and time">--:--:--</time>
        <button type="button" id="themeToggle" class="theme-toggle"
                aria-label="Switch to dark theme" aria-pressed="false">
          <!-- moon shows in light mode (click for dark) -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
          </svg>
          <!-- sun shows in dark mode (click for light) -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <span class="toggle-text">Dark</span>
        </button>
      </div>
    </header>

    <!-- masthead: gold kicker + the single large serif wordmark + descriptor + one aggregate readout -->
    <div class="masthead">
      <p class="kicker">A small shelf</p>
      <h1 class="wordmark">BucketFillers</h1>
      <p class="descriptor">a handful of self-hosted things, checked on now and then.</p>
      <p class="meta-line" id="metaLine" data-state="pending" aria-live="polite">
        <span class="meta-kicker">On the shelf</span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="agg-led" aria-hidden="true"></span>
        <span id="count">checking&hellip;</span>
      </p>
    </div>

    <main>
      <!-- FEATURED hero: BucketFillers. Name lives in the masthead above;
           here the gold "PRIMARY" stamp + host:port + Open carry the affordance. -->
      <a class="hero" href="https://bucketfillers.timhufnagel.org" rel="noopener"
         aria-label="Open BucketFillers at bucketfillers.timhufnagel.org port 3000">
        <div class="hero-top">
          <span class="eyebrow">Primary</span>
          <span class="status" data-state="pending" data-host="bucketfillers.timhufnagel.org">
            <span class="led" aria-hidden="true"></span><span class="label">checking</span>
          </span>
        </div>
        <div class="hero-foot">
          <span class="host">bucketfillers.timhufnagel.org <span class="port">:3000</span></span>
          <span class="open">Open <span class="arrow" aria-hidden="true">&rarr;</span></span>
        </div>
      </a>

      <!-- secondary services: quiet ruled ledger -->
      <h2 class="section-label">Also on the shelf</h2>
      <div class="svc-list" id="svcList"></div>
    </main>

    <footer>
      <span>status is a live, server-side health check &mdash; not a guess.</span>
      <span id="year"></span>
    </footer>
  </div>

<script>
  /* ============================================================
     Secondary services. (BucketFillers is the hero above.)
     Each renders as a quiet, typeset list row linking to its host.
     ============================================================ */
  const services = [
    { name: "Notes",     host: "notes.timhufnagel.org",    port: 3002 },
    { name: "World Cup", host: "worldcup.timhufnagel.org", port: 3003 },
    { name: "Florence",  host: "florence.timhufnagel.org", port: 8080 },
  ];

  const list = document.getElementById("svcList");
  services.forEach(svc => {
    const url = "https://" + svc.host;
    const a = document.createElement("a");
    a.className = "svc";
    a.href = url;
    a.rel = "noopener";
    a.setAttribute("aria-label", "Open " + svc.name + " at " + svc.host + " port " + svc.port);
    a.innerHTML = `
      <span class="svc-main">
        <span class="svc-name">${svc.name}</span>
        <span class="svc-host">${svc.host} <span class="port">:${svc.port}</span></span>
      </span>
      <span class="status" data-state="pending" data-host="${svc.host}">
        <span class="led" aria-hidden="true"></span><span class="label">checking</span>
      </span>
      <span class="svc-arrow" aria-hidden="true">&rarr;</span>`;
    list.appendChild(a);
  });

  /* ---------- live status: TRUE server-side health ----------
     A browser CANNOT read a cross-origin site's real HTTP status — the
     response is opaque under CORS — so a client-side ping can only prove
     "something answered at the edge", which is misleading: a tunnel that
     is up while the app behind it has crashed still answers (HTTP 5xx)
     and would look "online".

     Instead, status is computed SERVER-SIDE by the bundled status service
     (server.js) and exposed at /api/status. It fetches each origin, reads
     the REAL status code, and reports "up" only for a genuine response
     under 500 — so a dead app behind a live tunnel (5xx / timeout) is
     correctly shown OFFLINE. If the API itself is unreachable (e.g. this
     file is opened via file:// without the server), status is shown
     honestly as "unavailable" rather than guessed. See README.md.
  */
  const statusEls = {};
  document.querySelectorAll(".status[data-host]").forEach(el => { statusEls[el.dataset.host] = el; });
  const total = Object.keys(statusEls).length;

  const countEl  = document.getElementById("count");
  const metaLine = document.getElementById("metaLine");

  const NA_TITLE = "Live status needs the bundled status server (server.js). " +
                   "Open this page through it (e.g. http://localhost:8787) to see real up/down.";

  function setStatus(el, state, label, title) {
    el.setAttribute("data-state", state);
    el.querySelector(".label").textContent = label;
    if (title) el.setAttribute("title", title);
    else el.removeAttribute("title");
  }

  // Human-readable detail for the hover tooltip on each pill.
  function describe(svc) {
    if (svc.state === "up") {
      return "online" + (svc.code ? " · HTTP " + svc.code : "") +
             (svc.ms != null ? " · " + svc.ms + " ms" : "");
    }
    return "offline · " + (svc.code ? "HTTP " + svc.code : (svc.error || "no response"));
  }

  // Single aggregate readout. The dot color mirrors state (supplementary
  // to the always-present text), never the sole signal.
  function renderAggregate(online, available, settled) {
    if (!available) { countEl.textContent = "status unavailable"; metaLine.setAttribute("data-state", "na"); return; }
    if (!settled)   { countEl.textContent = "checking…";     metaLine.setAttribute("data-state", "pending"); return; }
    countEl.innerHTML = `<strong>${online} / ${total}</strong> online`;
    metaLine.setAttribute("data-state", online === total ? "up" : (online > 0 ? "partial" : "down"));
  }

  let pollTimer = null;
  function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  async function poll() {
    let data = null;
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      if (res.ok) data = await res.json();
    } catch (e) { /* backend not reachable — fall through to honest "na" */ }

    if (!data || !Array.isArray(data.services)) {
      Object.values(statusEls).forEach(el => setStatus(el, "na", "status n/a", NA_TITLE));
      renderAggregate(0, false, false);
      schedule(10000); // keep retrying in case the server comes up
      return;
    }

    let online = 0, pending = 0;
    data.services.forEach(svc => {
      const el = statusEls[svc.host];
      if (!el) return;
      if (svc.state === "up")        { online++;  setStatus(el, "up",      "online",  describe(svc)); }
      else if (svc.state === "down") {            setStatus(el, "down",    "offline", describe(svc)); }
      else                           { pending++; setStatus(el, "pending", "checking", null); }
    });
    renderAggregate(online, true, pending === 0);
    schedule(pending ? 2500 : 15000); // converge fast while a check is mid-flight, then ease off
  }

  poll();

  /* ---------- live clock (tabular nums, updates every second) ---------- */
  const clockEl = document.getElementById("clock");
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    clockEl.textContent =
      `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} · ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);

  /* footer: current year only, no personal name */
  document.getElementById("year").textContent = new Date().getFullYear();

  /* ============================================================
     THEME TOGGLE
     - Explicit choice persists in localStorage ("bf-theme").
     - With no explicit choice, follow live system changes.
     - Toggle is a real toggle button: aria-pressed reflects dark,
       and aria-label + visible text are updated on every toggle
       (not relying on CSS-generated content for the accessible name).
     ============================================================ */
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");
  const toggleText = toggle.querySelector(".toggle-text");
  const STORAGE_KEY = "bf-theme";

  function reflect(theme) {
    const isDark = theme === "dark";
    toggle.setAttribute("aria-pressed", String(isDark));
    // label/text describe the action the button performs
    toggleText.textContent = isDark ? "Light" : "Dark";
    toggle.setAttribute("aria-label",
      isDark ? "Switch to light theme" : "Switch to dark theme");
  }

  reflect(root.getAttribute("data-theme") || "light");

  toggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
    reflect(next);
  });

  /* Follow live system changes ONLY when no explicit choice is stored. */
  const mql = window.matchMedia("(prefers-color-scheme: dark)");
  const onSystemChange = e => {
    let stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch (err) {}
    if (stored !== "light" && stored !== "dark") {
      const theme = e.matches ? "dark" : "light";
      root.setAttribute("data-theme", theme);
      reflect(theme);
    }
  };
  if (mql.addEventListener) mql.addEventListener("change", onSystemChange);
  else if (mql.addListener) mql.addListener(onSystemChange);
</script>
</body>
</html>
